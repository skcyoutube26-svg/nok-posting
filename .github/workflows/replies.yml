name: replies
# Nok answers comments under her own posts. Logs show only comment ids, never text (public repo).
on:
  schedule:
    - cron: "17 */2 * * *"   # GitHub fires this every few hours at best
  workflow_dispatch:
    inputs:
      dry:
        description: preview only
        default: "no"
      file:
        description: replies file for manual mode
        default: ""
      sample:
        description: print replies to made-up comments (posts nothing)
        default: "no"
      seed:
        description: mark all existing comments answered (no replies)
        default: "no"
      manual:
        description: post manual-replies.json instead of auto replies
        default: "no"
concurrency: replies
permissions:
  contents: write
jobs:
  replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python replies.py ${{ github.event.inputs.dry == 'yes' && '--dry' || '' }} ${{ github.event.inputs.seed == 'yes' && '--seed' || '' }} ${{ github.event.inputs.sample == 'yes' && '--sample' || '' }} ${{ github.event.inputs.manual == 'yes' && '--manual' || '' }} ${{ github.event.inputs.file && format('--file {0}', github.event.inputs.file) || '' }}
      - name: keep answered ids
        run: |
          git config user.name nok-bot; git config user.email nok-bot@users.noreply.github.com
          git add answered.json 2>/dev/null && git commit -qm "replies: answered ids" && git push -q || true
