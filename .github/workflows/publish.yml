name: publish
on:
  schedule:
    - cron: "*/10 * * * *"   # publish check; GitHub may start runs 5-20 min late
    - cron: "0 3 * * 1"      # weekly token refresh
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    if: github.event.schedule != '0 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest queue, not the commit this run was triggered on (posted the rugs Reel twice, 3 Oct)
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python publish.py
      - name: Record what was published
        if: always()
        run: |
          git config user.name "nok-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue done media
          git diff --cached --quiet && exit 0
          git commit -m "published"
          # a failed push would leave the item queued and post it twice
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done; exit 1
  refresh-token:
    # ponytail: extends the 60-day token; if Meta ever hands back a new string, the owner re-pastes it
    if: github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - run: curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${{ secrets.IG_TOKEN }}" -o /dev/null
