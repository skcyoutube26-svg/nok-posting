name: publish
on:
  schedule:
    # GitHub throttles scheduled runs (documented: delays at busy times, especially the top of the hour; runs can be dropped).
    # Seen 2-4 Nov: only ~4 runs a day, 16:00Z Reels started 16:21Z, 18:45Z, 22:42Z. So: many entries just before and after
    # each slot (13:00, 16:00, 23:00Z), at off-peak minutes. publish.py waits at most 20 min for a post due soon.
    - cron: "47,57 12 * * *"    # 13:00 slot
    - cron: "7,17,27,37,47 13 * * *"
    - cron: "47,57 15 * * *"    # 16:00 slot
    - cron: "7,17,27,37,47 16 * * *"
    - cron: "47,57 22 * * *"    # 23:00 slot
    - cron: "7,17,27,37,47 23 * * *"
    - cron: "*/10 * * * *"      # catch-all for any other publish_at (0100Z, 1230Z, 1630Z, 1700Z...); the dense lines above add chances at the main slots
    - cron: "0 3 * * 1"      # weekly token refresh
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false   # never kill a run mid-post; a waiting run takes over
jobs:
  publish:
    if: github.event.schedule != '0 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest queue, not the commit this run was triggered on (posted the rugs Reel twice, 3 Oct)
      - name: Publish due posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python publish.py
      - name: Record what was published
        if: always()
        run: |
          git config user.name "nok-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue done media
          git diff --cached --quiet && exit 0
          git commit -m "published"
          # a failed push would leave the item queued and post it twice
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done; exit 1
  refresh-token:
    # ponytail: extends the 60-day token; if Meta ever hands back a new string, the owner re-pastes it
    if: github.event.schedule == '0 3 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Refresh token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          echo "::add-mask::$IG_TOKEN"
          curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN" -o /dev/null
      - name: Open issue if refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Instagram token refresh failed: check the token"
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            echo "refresh-failed issue already open"; exit 0
          fi
          printf '%s\n' \
            "The weekly Instagram token refresh failed, so the token will run out about 60 days after its last good refresh." \
            "" \
            "Run: $RUN_URL" \
            "" \
            "To fix it: open the run above, then make a fresh token in the Meta app dashboard and replace the IG_TOKEN secret in this repo's Actions secrets." \
            "" \
            "Opened automatically. This issue never contains the token." > "$RUNNER_TEMP/body.txt"
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.txt"
