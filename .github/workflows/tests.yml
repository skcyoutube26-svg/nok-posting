name: tests
# Publisher tests. Everything is mocked: no secrets, no Instagram calls, never runs publish.py. Safe on any branch or PR.
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest
      - run: python -m pytest -q -p no:cacheprovider
