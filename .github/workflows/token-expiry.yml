name: token expiry
# Warns by GitHub issue when the Instagram token has 14 days or fewer left. Posts nothing, touches no queue.
# Logs show only "expires in N days" (public repo); the token is masked and never printed.
on:
  # The weekly schedule is OFF until the owner switches it on: uncomment the next 2 lines.
  # schedule:
  #   - cron: "0 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: token-expiry
jobs:
  token-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read expiry
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          echo "::add-mask::$IG_TOKEN"
          python token_expiry.py --issue-file "$RUNNER_TEMP/issue.txt"
      - name: Open warning issue
        if: hashFiles(format('{0}/issue.txt', runner.temp)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(head -n 1 "$RUNNER_TEMP/issue.txt")
          tail -n +2 "$RUNNER_TEMP/issue.txt" > "$RUNNER_TEMP/body.txt"
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            echo "warning issue already open"; exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/body.txt"
