name: dm
# Nok's DMs. Logs show only ids, never message text (public repo).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: test or private
        default: test
      file:
        description: replies file
        default: ""
concurrency: dm
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: if [ "${{ github.event.inputs.mode }}" = cleanup ]; then python cleanup.py; else python dm.py --${{ github.event.inputs.mode }} ${{ github.event.inputs.file && format('--file {0}', github.event.inputs.file) || '' }}; fi
